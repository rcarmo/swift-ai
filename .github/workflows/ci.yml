name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: make static-check
      - run: make sbom-check
      - uses: actions/upload-artifact@v5
        with:
          name: swift-ai-sbom
          path: |
            .artifacts/sbom/swift-ai.cdx.json
            .artifacts/sbom/swift-ai.cdx.json.sha256
            .artifacts/sbom/swift-ai-security-scan.json
            .artifacts/sbom/swift-ai-license-review.json
          retention-days: 30

  swift-test:
    strategy:
      matrix:
        # macOS hosted CI is disabled by project policy; routine CI keeps Ubuntu + static checks only.
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: make check
