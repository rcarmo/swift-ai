name: Publish SBOM release assets

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish SBOM assets under (upstream-vX.Y.Z alias or native vX.Y.Z)
        default: upstream-v0.85.1
        required: true
        type: string
      upstream_version:
        description: Upstream pi-ai version without leading v, matching release_tag
        default: 0.85.1
        required: true
        type: string
      release_kind:
        description: "Release kind: upstream alias (upstream-vX.Y.Z) or native Swift tag (vX.Y.Z)"
        default: upstream
        required: true
        type: string
      runtime_ref:
        description: Accepted 40-hex runtime commit SHA to build the SBOM from
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${{ inputs.upstream_version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "upstream_version must be strict semver without leading v: ${{ inputs.upstream_version }}" >&2
            exit 1
          fi
          case "${{ inputs.release_kind }}" in
            upstream) expected_tag="upstream-v${{ inputs.upstream_version }}" ;;
            native) expected_tag="v${{ inputs.upstream_version }}" ;;
            *) echo "release_kind must be upstream or native: ${{ inputs.release_kind }}" >&2; exit 1 ;;
          esac
          if [[ "${{ inputs.release_tag }}" != "$expected_tag" ]]; then
            echo "release_tag must match release_kind/upstream_version: ${{ inputs.release_tag }} != $expected_tag" >&2
            exit 1
          fi
          if [[ ! "${{ inputs.runtime_ref }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "runtime_ref must be a full 40-hex commit SHA: ${{ inputs.runtime_ref }}" >&2
            exit 1
          fi

      - name: Checkout accepted runtime ref
        uses: actions/checkout@v5
        with:
          ref: "${{ inputs.runtime_ref }}"
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Generate and validate SBOM
        shell: bash
        run: |
          set -euo pipefail
          swift --version
          runtime_sha="$(git rev-parse HEAD)"
          if [[ "$runtime_sha" != "${{ inputs.runtime_ref }}" ]]; then
            echo "checked-out runtime ref mismatch: $runtime_sha != ${{ inputs.runtime_ref }}" >&2
            exit 1
          fi
          make sbom-check
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          sbom = json.loads(Path('.artifacts/sbom/swift-ai.cdx.json').read_text())
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          props = {
              item.get('name'): item.get('value')
              for item in sbom.get('metadata', {}).get('component', {}).get('properties', [])
          }
          if props.get('git.revision') != revision:
              raise SystemExit(f"SBOM git.revision {props.get('git.revision')} does not match {revision}")
          if props.get('git.dirty') != 'false':
              raise SystemExit('SBOM was generated from a dirty checkout')
          if len(sbom.get('components') or []) != 2:
              raise SystemExit('SBOM component count must be 2')
          print('ok: SBOM revision/component checks')
          PY

      - name: Normalise release asset names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .artifacts/sbom/swift-ai.cdx.json dist/sbom.cdx.json
          digest="$(sha256sum dist/sbom.cdx.json | awk '{print $1}')"
          printf '%s  sbom.cdx.json\n' "$digest" > dist/sbom.cdx.json.sha256
          (cd dist && sha256sum -c sbom.cdx.json.sha256)

      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.release_tag }}'
          runtime_ref='${{ inputs.runtime_ref }}'
          release_kind='${{ inputs.release_kind }}'
          runtime_sha="$(git rev-parse HEAD)"
          upstream_version='${{ inputs.upstream_version }}'
          if [[ "$release_kind" == "native" ]]; then
            title="swift-ai v${upstream_version}"
            notes="CycloneDX SBOM for swift-ai v${upstream_version}, generated from accepted runtime ref ${runtime_ref} (${runtime_sha}) and validated by make sbom-check."
            if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
              tag_target="$(git rev-parse --verify "${tag}^{commit}")"
              if [[ "$tag_target" != "$runtime_sha" ]]; then
                echo "existing tag $tag peels to $tag_target, expected $runtime_sha" >&2
                exit 1
              fi
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$tag" "$runtime_sha" -m "swift-ai v${upstream_version}"
              git push origin "refs/tags/${tag}"
            fi
            tag_object="$(git rev-parse --verify "${tag}^{tag}")"
            tag_target="$(git rev-parse --verify "${tag}^{commit}")"
            if [[ -z "$tag_object" || "$tag_target" != "$runtime_sha" ]]; then
              echo "tag $tag verification failed: object=$tag_object target=$tag_target expected=$runtime_sha" >&2
              exit 1
            fi
          else
            title="SBOM for @earendil-works/pi-ai v${upstream_version}"
            notes="CycloneDX SBOM for @earendil-works/pi-ai v${upstream_version}, generated from swift-ai runtime ref ${runtime_ref} (${runtime_sha}) and validated by make sbom-check."
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            existing_target="$(gh release view "$tag" --json targetCommitish --jq '.targetCommitish')"
            existing_sha="$(git rev-parse --verify "${existing_target}^{commit}")"
            if [[ "$existing_sha" != "$runtime_sha" ]]; then
              echo "existing release $tag points to $existing_sha, expected $runtime_sha" >&2
              exit 1
            fi
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" --target "$runtime_sha" --title "$title" --notes "$notes"
          fi

      - name: Upload SBOM assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload '${{ inputs.release_tag }}' dist/sbom.cdx.json dist/sbom.cdx.json.sha256 --clobber
